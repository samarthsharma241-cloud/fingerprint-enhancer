              result.subtype = detectedCores >= 2 ? 'Double Loop Whorl' : 'Plain Whorl';
              result.confidence = Math.min(98, 88 + detectedDeltas * 4);
            } else if (detectedDeltas === 1 || detectedCores === 1 || avgThrust > 0.55) {
              result = { ...this.PATTERNS.LOOP };
              result.cores = Math.max(1, detectedCores);
              result.deltas = 1;
              // Determine flow direction (Ulnar vs Radial) based on delta relative x position
              const deltaX = deltaPoints[0] ? deltaPoints[0].x : w * 0.3;
              const coreX = corePoints[0] ? corePoints[0].x : w * 0.5;
              result.subtype = deltaX > coreX ? 'Radial Loop' : 'Ulnar Loop';
              result.confidence = Math.min(97, 89 + (detectedCores + detectedDeltas) * 3);
            } else {
              result = { ...this.PATTERNS.ARCH };
              result.cores = 0;
              result.deltas = 0;
              result.subtype = avgThrust > 0.4 ? 'Tented Arch' : 'Plain Arch';
              result.confidence = Math.min(95, 87 + Math.round((1 - avgThrust) * 8));
            }

            result.detectedCores = detectedCores;
            result.detectedDeltas = detectedDeltas;
            result.corePoints = corePoints;
            result.deltaPoints = deltaPoints;
            result.isOverridden = false;
            return result;
          } catch (err) {
            console.warn('Henry classifier fallback', err);
            return { ...this.PATTERNS.LOOP, confidence: 91, isOverridden: false };
          }
        }
      }

      // ==========================================================================
      // 9e. Interactive UV-Vis Spectrophotometric Curve Simulator
      // ==========================================================================
      class UVVisSpectrometer {
        static SPECTRA = {
          ninhydrin: {
            title: "Ruhemann's Purple (Ninhydrin + Amino Acids)",
            reagentName: "Ninhydrin",
            primaryPeakNm: 575,
            peakAbsorbance: 0.94,
            widthNm: 36,
            secondaryPeakNm: 408,
            secondaryAbs: 0.35,
            curveColor: '#a855f7',
            fillColor: 'rgba(168, 85, 247, 0.22)',
            type: 'absorbance',
            excitationCursorDefault: 365,
            description: "Strong localized absorption in yellow/green band (λ_max = 575 nm) producing the distinctive Ruhemann's Purple chromophore. High contrast on porous paper."
          },
          cyanoacrylate: {
            title: "Cyanoacrylate Ester + Rhodamine 6G (ALS Fluorescent)",
            reagentName: "Cyanoacrylate + R6G",
            primaryPeakNm: 525, // Excitation peak
            peakAbsorbance: 0.88,
            widthNm: 28,
            emissionPeakNm: 550, // Stokes shift emission peak
            emissionIntensity: 0.96,
            emissionWidthNm: 32,
            curveColor: '#38bdf8',
            emissionColor: '#fb923c',
            fillColor: 'rgba(251, 146, 60, 0.25)',
            type: 'fluorescence',
            excitationCursorDefault: 525,
            description: "Dual-curve Stokes Shift: Excitation peak at 525 nm (absorbs green laser / blue-green ALS), re-emitting intense fluorescent orange luminescence peaking at 550 nm."
          },
          silver_nitrate: {
            title: "Colloidal Silver Nanoparticles (Silver Nitrate Photoreaction)",
            reagentName: "Silver Nitrate",
            primaryPeakNm: 420,
            peakAbsorbance: 0.86,
            widthNm: 55,
            tailDecay: 0.0035,
            curveColor: '#f59e0b',
            fillColor: 'rgba(245, 158, 11, 0.2)',
            type: 'plasmon',
            excitationCursorDefault: 365,
            description: "Broad surface plasmon resonance (SPR) absorption centered at 420 nm in the near-UV/blue spectrum, forming dark brown to black photoreacted metallic silver deposits."
          }
        };

        static getAbsorbanceAt(spec, nm) {
          if (!spec) return 0.1;
          if (spec.type === 'absorbance') {
            const diff1 = nm - spec.primaryPeakNm;
            const g1 = spec.peakAbsorbance * Math.exp(-(diff1 * diff1) / (2 * spec.widthNm * spec.widthNm));
            const diff2 = nm - spec.secondaryPeakNm;
            const g2 = spec.secondaryAbs * Math.exp(-(diff2 * diff2) / (2 * 20 * 20));
            return Math.min(1.0, 0.04 + g1 + g2);
          } else if (spec.type === 'fluorescence') {
            const diffEx = nm - spec.primaryPeakNm;
            const ex = spec.peakAbsorbance * Math.exp(-(diffEx * diffEx) / (2 * spec.widthNm * spec.widthNm));
            const diffEm = nm - spec.emissionPeakNm;
            const em = spec.emissionIntensity * Math.exp(-(diffEm * diffEm) / (2 * spec.emissionWidthNm * spec.emissionWidthNm));
            return Math.min(1.0, 0.05 + ex * 0.7 + em * 0.8);
          } else {
            // Plasmon
            const diff = nm - spec.primaryPeakNm;
            const peak = spec.peakAbsorbance * Math.exp(-(diff * diff) / (2 * spec.widthNm * spec.widthNm));
            const tail = nm > spec.primaryPeakNm ? Math.exp(-spec.tailDecay * (nm - spec.primaryPeakNm)) * 0.35 : 0;
            return Math.min(1.0, 0.06 + peak + tail);
          }
        }

        static render(canvasEl, reagentKey = 'ninhydrin', cursorWavelength = 365, onCursorChange = null) {
          if (!canvasEl) return;
          const ctx = canvasEl.getContext('2d');
          const dpr = window.devicePixelRatio || 1;
          const rect = canvasEl.getBoundingClientRect();
          const w = rect.width || 560;
          const h = rect.height || 240;

          if (canvasEl.width !== Math.round(w * dpr) || canvasEl.height !== Math.round(h * dpr)) {
            canvasEl.width = Math.round(w * dpr);
            canvasEl.height = Math.round(h * dpr);
          }
          ctx.resetTransform();
          ctx.scale(dpr, dpr);

          const spec = this.SPECTRA[reagentKey] || this.SPECTRA.ninhydrin;
          const minWl = 300;
          const maxWl = 750;
          const padL = 46, padR = 24, padT = 32, padB = 40;
          const plotW = w - padL - padR;
          const plotH = h - padT - padB;

          const wlToX = wl => padL + ((wl - minWl) / (maxWl - minWl)) * plotW;
          const xToWl = x => Math.round(minWl + ((x - padL) / plotW) * (maxWl - minWl));
          const valToY = v => padT + (1.0 - v) * plotH;

          // 1. Dark Lab Background
          ctx.fillStyle = '#060a14';
          ctx.fillRect(0, 0, w, h);

          // 2. Visible Spectrum Ambient Rainbow Band Along Baseline (380 - 700 nm)
          const gradRainbow = ctx.createLinearGradient(wlToX(380), 0, wlToX(700), 0);
          gradRainbow.addColorStop(0.0, 'rgba(124, 58, 237, 0.28)'); // Violet
          gradRainbow.addColorStop(0.18, 'rgba(37, 99, 235, 0.28)');  // Blue
          gradRainbow.addColorStop(0.38, 'rgba(16, 185, 129, 0.28)'); // Green
          gradRainbow.addColorStop(0.55, 'rgba(234, 179, 8, 0.28)');  // Yellow
          gradRainbow.addColorStop(0.72, 'rgba(249, 115, 22, 0.28)'); // Orange
          gradRainbow.addColorStop(1.0, 'rgba(239, 68, 68, 0.28)');   // Red

          ctx.fillStyle = gradRainbow;
          ctx.fillRect(wlToX(380), padT, wlToX(700) - wlToX(380), plotH);

          // 3. Gridlines & Axes
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
          ctx.lineWidth = 1;
          for (let yv = 0; yv <= 1.0; yv += 0.25) {
            const py = valToY(yv);
            ctx.beginPath();
            ctx.moveTo(padL, py);
            ctx.lineTo(w - padR, py);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.font = '9px Roboto, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(yv.toFixed(2), padL - 8, py + 3);
          }

          const wlTicks = [300, 365, 400, 450, 500, 550, 600, 650, 700, 750];
          wlTicks.forEach(tick => {
            const px = wlToX(tick);
            ctx.beginPath();
            ctx.moveTo(px, padT);
            ctx.lineTo(px, h - padB);
            ctx.stroke();

            ctx.fillStyle = tick === 365 ? '#c084fc' : 'rgba(255, 255, 255, 0.55)';
            ctx.font = tick === 365 ? 'bold 10px Roboto, sans-serif' : '9px Roboto, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`${tick}`, px, h - padB + 14);
          });

          // Axis Labels
          ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
          ctx.font = '10px Roboto, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Wavelength λ (nanometers)', padL + plotW / 2, h - 8);

          ctx.save();
          ctx.translate(14, padT + plotH / 2);
          ctx.rotate(-Math.PI / 2);
          ctx.fillText(spec.type === 'fluorescence' ? 'Absorbance / Emission Intensity' : 'Absorbance (O.D.)', 0, 0);
          ctx.restore();

          // 4. Plot Curve(s)
          if (spec.type === 'fluorescence') {
            // Excitation Curve (Dashed Cyan)
            ctx.beginPath();
            for (let wl = minWl; wl <= maxWl; wl += 2) {
              const diffEx = wl - spec.primaryPeakNm;
              const exVal = Math.min(1.0, 0.05 + spec.peakAbsorbance * Math.exp(-(diffEx * diffEx) / (2 * spec.widthNm * spec.widthNm)));
              const px = wlToX(wl);
              const py = valToY(exVal);
              if (wl === minWl) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Emission Curve (Solid Orange Glowing)
            ctx.beginPath();
            ctx.moveTo(wlToX(minWl), valToY(0));
            for (let wl = minWl; wl <= maxWl; wl += 2) {
              const diffEm = wl - spec.emissionPeakNm;
              const emVal = Math.min(1.0, 0.05 + spec.emissionIntensity * Math.exp(-(diffEm * diffEm) / (2 * spec.emissionWidthNm * spec.emissionWidthNm)));
              ctx.lineTo(wlToX(wl), valToY(emVal));
            }
            ctx.lineTo(wlToX(maxWl), valToY(0));
            ctx.closePath();
            ctx.fillStyle = 'rgba(251, 146, 60, 0.2)';
            ctx.fill();

            ctx.beginPath();
            for (let wl = minWl; wl <= maxWl; wl += 2) {
              const diffEm = wl - spec.emissionPeakNm;
              const emVal = Math.min(1.0, 0.05 + spec.emissionIntensity * Math.exp(-(diffEm * diffEm) / (2 * spec.emissionWidthNm * spec.emissionWidthNm)));
              const px = wlToX(wl);
              const py = valToY(emVal);
              if (wl === minWl) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.strokeStyle = '#fb923c';
            ctx.lineWidth = 2.5;
            ctx.stroke();
          } else {
            // Single Absorbance Curve with Gradient Fill
            ctx.beginPath();
            ctx.moveTo(wlToX(minWl), valToY(0));
            for (let wl = minWl; wl <= maxWl; wl += 2) {
              const abs = UVVisSpectrometer.getAbsorbanceAt(spec, wl);
              ctx.lineTo(wlToX(wl), valToY(abs));
            }
            ctx.lineTo(wlToX(maxWl), valToY(0));
            ctx.closePath();
            ctx.fillStyle = spec.fillColor;
            ctx.fill();

            ctx.beginPath();
            for (let wl = minWl; wl <= maxWl; wl += 2) {
              const abs = UVVisSpectrometer.getAbsorbanceAt(spec, wl);
              const px = wlToX(wl);
              const py = valToY(abs);
              if (wl === minWl) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.strokeStyle = spec.curveColor;
            ctx.lineWidth = 2.5;
            ctx.stroke();
          }

          // 5. Peak Callout Dot
          const peakX = wlToX(spec.primaryPeakNm);
          const peakY = valToY(spec.peakAbsorbance);
          ctx.beginPath();
          ctx.arc(peakX, peakY, 4.5, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.strokeStyle = spec.curveColor;
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 10px Roboto, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`λ_max = ${spec.primaryPeakNm} nm`, peakX, Math.max(padT + 12, peakY - 8));

          // 6. Interactive ALS Cursor Indicator
          const cursorClamped = Math.max(minWl, Math.min(maxWl, cursorWavelength));
          const curX = wlToX(cursorClamped);
          const curAbs = this.getAbsorbanceAt(spec, cursorClamped);
          const curY = valToY(curAbs);

          // Vertical glowing cursor
          ctx.beginPath();
          ctx.moveTo(curX, padT - 6);
          ctx.lineTo(curX, h - padB + 2);
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.shadowColor = 'rgba(56, 189, 248, 0.8)';
          ctx.shadowBlur = 8;
          ctx.stroke();
          ctx.shadowBlur = 0;

          // Intersection bead
          ctx.beginPath();
          ctx.arc(curX, curY, 5, 0, Math.PI * 2);
          ctx.fillStyle = '#38bdf8';
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Top Cursor Badge
          const badgeText = `⚡ ALS: ${cursorClamped} nm`;
          ctx.font = 'bold 10px Roboto, sans-serif';
          const tw = ctx.measureText(badgeText).width + 12;
          const bx = Math.max(padL + tw / 2, Math.min(w - padR - tw / 2, curX));
          ctx.fillStyle = '#0284c7';
          ctx.beginPath();
          ctx.roundRect(bx - tw / 2, padT - 22, tw, 18, 4);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.fillText(badgeText, bx, padT - 9);

          // 7. Interactive Click & Drag Handling
          if (onCursorChange && !canvasEl._hasCursorListener) {
            canvasEl._hasCursorListener = true;
            let isDown = false;
            const updateFromEvent = (e) => {
              const r = canvasEl.getBoundingClientRect();
              const clientX = e.touches ? e.touches[0].clientX : e.clientX;
              const relX = clientX - r.left;
              const newWl = Math.max(minWl, Math.min(maxWl, xToWl(relX)));
              onCursorChange(newWl);
            };

            canvasEl.addEventListener('mousedown', (e) => { isDown = true; updateFromEvent(e); });
            window.addEventListener('mousemove', (e) => { if (isDown) updateFromEvent(e); });
            window.addEventListener('mouseup', () => { isDown = false; });
            canvasEl.addEventListener('touchstart', (e) => { isDown = true; updateFromEvent(e); }, { passive: true });
            window.addEventListener('touchmove', (e) => { if (isDown) updateFromEvent(e); }, { passive: true });
            window.addEventListener('touchend', () => { isDown = false; });
          }
        }
      }

                  </div>
                  <div class="comparison-pane">
                    <div class="pane-header">
                      <span class="pane-title" style="color: var(--md-sys-color-primary);">${Icons.auto_fix_high} ${isUV ? 'Enhanced Image (UV Fluorescence)' : 'Processed Impression'}</span>
                      <span class="m3-chip m3-chip-primary">${isUV ? 'Fluorescent' : 'Enhanced Output'}</span>

                    <div class="pane-canvas-box ${isCyano ? 'dark-bg-raw' : ''}" id="e-enh-box">

                        <div class="lens-reticle-ring-inner"></div>
                        <div class="lens-crosshair-h"></div>
                        <div class="lens-crosshair-v"></div>

                <!-- 2. Interactive Split Curtain Before/After Slider Container -->

                  <div class="curtain-viewport" id="curtain-viewport">
                    <!-- Layer 1: Enhanced / Processed Image (Right Background) -->
                    <div class="curtain-layer curtain-enhanced-layer" id="curtain-enhanced-box">
                      <span class="curtain-badge curtain-badge-right">${isUV ? '⚡ FLUORESCENT RIDGE' : '✨ ENHANCED PRINT'}</span>
                    </div>
                    <!-- Layer 2: Raw Latent Image (Left Clipped Layer) -->
                    <div class="curtain-layer curtain-raw-layer" id="curtain-raw-box">
                      <span class="curtain-badge curtain-badge-left">🔍 RAW LATENT</span>
                    </div>
                    <!-- Draggable Divider Line & Handle -->
                    <div class="curtain-divider" id="curtain-divider">
                      <div class="curtain-line"></div>
                      <div class="curtain-handle" id="curtain-handle" title="Drag to compare before & after">
                        <svg viewBox="0 0 24 24"><path d="M8.5 7l-5 5 5 5V7zm7 0v10l5-5-5-5z"/></svg>
                      </div>
                    </div>
                  </div>
                  <div class="curtain-hint">
                    <span>⟵ <strong>RAW LATENT PRINT</strong></span>
                    <span>Drag handle left/right to reveal live contrast & ridge enhancement</span>
                    <span><strong>${isUV ? 'UV FLUORESCENCE' : 'SHARP ENHANCED'}</strong> ⟶</span>
                  </div>

          </div>
        `;

        // Mount original canvas in side-by-side box
        const origBox = document.getElementById('e-orig-box');
        const enhBox = document.getElementById('e-enh-box');
        const sbsContainer = document.getElementById('side-by-side-container');
        const curtainContainer = document.getElementById('split-curtain-container');
        const curtainRawBox = document.getElementById('curtain-raw-box');
        const curtainEnhBox = document.getElementById('curtain-enhanced-box');
        const origC = appState.get('originalCanvas');

        if (origBox && origC) {
          origBox.insertBefore(origC, origBox.firstChild);
        }

        // Live Curtain Synchronization
        const updateCurtainCanvases = () => {
          if (!curtainRawBox || !curtainEnhBox) return;
          const orig = appState.get('originalCanvas');
          const enhC = enhBox ? (enhBox.querySelector('canvas') || appState.get('enhancedCanvas')) : appState.get('enhancedCanvas');
          const ridge = appState.get('ridgeMapCanvas');
          const activeTarget = (activeViewMode === 'ridge' && ridge) ? ridge : enhC;

          if (orig) {
            const rawClone = document.createElement('canvas');
            rawClone.width = orig.width; rawClone.height = orig.height;
            rawClone.getContext('2d').drawImage(orig, 0, 0);
            const badgeL = curtainRawBox.querySelector('.curtain-badge');
            curtainRawBox.innerHTML = '';
            curtainRawBox.appendChild(rawClone);
            if (badgeL) curtainRawBox.appendChild(badgeL);
          }

          if (activeTarget) {
            const enhClone = document.createElement('canvas');
            enhClone.width = activeTarget.width; enhClone.height = activeTarget.height;
            enhClone.getContext('2d').drawImage(activeTarget, 0, 0);
            const badgeR = curtainEnhBox.querySelector('.curtain-badge');
            curtainEnhBox.innerHTML = '';
            curtainEnhBox.appendChild(enhClone);
            if (badgeR) curtainEnhBox.appendChild(badgeR);
          }
        };

        // Curtain Slider Position Management
        let curtainPct = appState.get('curtainSplitPct') || 50;
        const applyCurtainPos = (pct) => {
          curtainPct = Math.max(2, Math.min(98, pct));
          appState.set('curtainSplitPct', curtainPct);
          const divider = document.getElementById('curtain-divider');
          if (divider) divider.style.left = `${curtainPct}%`;
          if (curtainRawBox) curtainRawBox.style.clipPath = `inset(0 ${100 - curtainPct}% 0 0)`;
        };
        applyCurtainPos(curtainPct);

        // Curtain Viewport Pointer Events
        const curtainViewport = document.getElementById('curtain-viewport');
        if (curtainViewport) {
          let isDragging = false;
          const handleMove = (clientX) => {
            const rect = curtainViewport.getBoundingClientRect();
            if (rect.width > 0) {
              const p = ((clientX - rect.left) / rect.width) * 100;
              applyCurtainPos(p);
            }
          };

          curtainViewport.addEventListener('pointerdown', (ev) => {
            isDragging = true;
            curtainViewport.setPointerCapture?.(ev.pointerId);
            document.getElementById('curtain-handle')?.classList.add('dragging');
            handleMove(ev.clientX);
          });
          window.addEventListener('pointermove', (ev) => {
            if (isDragging) handleMove(ev.clientX);
          });
          const stopDrag = () => {
            if (isDragging) {
              isDragging = false;
              document.getElementById('curtain-handle')?.classList.remove('dragging');
            }
          };
          window.addEventListener('pointerup', stopDrag);
          window.addEventListener('pointercancel', stopDrag);
        }

        // Live Simulation Application Function
        const updateSimulationDisplay = () => {
          const currentChem = appState.get('appliedChemical');
          const currentSub = appState.get('substrate');
          const orig = appState.get('originalCanvas');
          if (!orig) return;

          const validation = ChemicalSimulator.validate(currentSub, currentChem);
          const validationEl = document.getElementById('chem-validation-box');
          const simPanelEl = document.getElementById('chem-simulator-panel');

          if (validationEl) {
            validationEl.style.display = currentChem && currentSub ? 'block' : 'none';
            validationEl.innerHTML = validation.message;
            if (validation.valid) {
              validationEl.style.background = 'rgba(34, 197, 94, 0.12)';
              validationEl.style.color = '#15803d';
              validationEl.style.borderColor = 'rgba(34, 197, 94, 0.4)';
            } else {
              validationEl.style.background = 'rgba(245, 158, 11, 0.12)';
              validationEl.style.color = '#b45309';
              validationEl.style.borderColor = 'rgba(245, 158, 11, 0.4)';
            }
          }

          if (simPanelEl) {
            simPanelEl.style.display = validation.valid ? 'block' : 'none';
          }

          // Render UV-Vis Spectrometer in Simulation Panel
          const simSpectroCanvas = document.getElementById('enh-sim-spectro-canvas');
          if (simSpectroCanvas && validation.valid) {
            UVVisSpectrometer.render(simSpectroCanvas, currentChem || 'ninhydrin', currentALS, (newWl) => {
              currentALS = newWl;
              appState.set('alsWavelength', newWl);
              const lbl = document.getElementById('enh-sim-als-label');
              if (lbl) lbl.textContent = `ALS Cursor: ${newWl} nm`;
              UVVisSpectrometer.render(simSpectroCanvas, currentChem || 'ninhydrin', newWl);
            });
          }

          if (!validation.valid || !currentChem) {
            if (enhBox) {
              const overlay = enhBox.querySelector('.canvas-lens-overlay');
              enhBox.innerHTML = '';
              const enhC = appState.get('enhancedCanvas') || orig;
              if (enhC) enhBox.appendChild(enhC);
              if (overlay) enhBox.appendChild(overlay);
            }
            updateCurtainCanvases();
            return;
          }

          let simCanvas = null;
          let simScore = 50;

          if (currentChem === 'ninhydrin') {
            const mins = Number(appState.get('ninhydrinTime') || 45);
            simCanvas = ChemicalSimulator.simulateNinhydrin(orig, mins);

            const stageEl = document.getElementById('nin-stage-text');
            if (mins <= 15) {
              simScore = Math.round(15 + (mins / 15) * 10);
              if (stageEl) stageEl.innerHTML = '&#9888;&#65039; <strong>0 - 15 Mins:</strong> No reaction visible. Amino acids require time or accelerated heat to develop. (Clarity score: VERY LOW)';
            } else if (mins <= 45) {
              simScore = Math.round(28 + ((mins - 15) / 30) * 40);
              if (stageEl) stageEl.innerHTML = '&#9889; <strong>15 - 45 Mins:</strong> Partial reaction. Faint purple/pink ridges appearing. (Clarity score: MODERATE)';
            } else {
              simScore = Math.round(72 + ((mins - 45) / 15) * 22);
              if (stageEl) stageEl.innerHTML = '&#9989; <strong>45 - 60 Mins:</strong> Optimal Reaction! Amino acids fully bonded. Deep Ruhemann\'s Purple print visible. (Boost Clarity Score to 85+ / 100)';
            }
          } else if (currentChem === 'cyanoacrylate') {
            const hum = Number(appState.get('cyanoHumidity') || 80);
            const time = Number(appState.get('cyanoTime') || 20);
            simCanvas = ChemicalSimulator.simulateCyanoacrylate(orig, hum, time);

            const stageEl = document.getElementById('cy-stage-text');
            const isOptHum = hum >= 75 && hum <= 85;
            const isAcceptableHum = hum >= 65 && hum <= 95;

            if (!isAcceptableHum) {
              simScore = Math.round(30 + (time / 30) * 18);
              if (stageEl) stageEl.innerHTML = '&#9888;&#65039; <strong>Sub-optimal Humidity:</strong> Polymerization is faint or cluttered. Maintain 75% - 85% RH for optimal results. (Clarity score capped)';
            } else if (isOptHum && time >= 15) {
              simScore = Math.round(78 + ((time - 15) / 15) * 18);
              if (stageEl) stageEl.innerHTML = '&#9989; <strong>Polymerization successful!</strong> White Cyanoacrylate ester has hardened over ridge patterns. (Boost Clarity Score to 90+ / 100)';
            } else {
              simScore = Math.round(52 + (time / 30) * 26);
              if (stageEl) stageEl.innerHTML = '&#9203; <strong>Incipient Polymerization:</strong> White monomer esters beginning to nucleate along ridge residues.';
            }
          } else if (currentChem === 'silver_nitrate') {
            const time = Number(appState.get('silverTime') || 10);
            simCanvas = ChemicalSimulator.simulateSilverNitrate(orig, time);
            simScore = Math.min(88, Math.round(55 + (time / 15) * 33));
          }

          if (simCanvas && enhBox) {
            const overlay = enhBox.querySelector('.canvas-lens-overlay');
            enhBox.innerHTML = '';
            enhBox.appendChild(simCanvas);
            if (overlay) enhBox.appendChild(overlay);

            // Update Clarity Score visually in real time
            const scoreNum = document.getElementById('enh-score-number');
            const circleProg = document.getElementById('enh-circle-progress');
            const afterScore = document.getElementById('enh-after-score');
            const rawScore = clarity.rawScore || 20;
            const deltaBadgeContainer = document.getElementById('enh-delta-badge-container');

            if (scoreNum) scoreNum.textContent = simScore;
            if (afterScore) afterScore.textContent = simScore;
            if (circleProg) circleProg.setAttribute('stroke-dasharray', `${simScore}, 100`);

            const delta = simScore - rawScore;
            const deltaStr = delta >= 0 ? `+${delta}` : `${delta}`;
            if (deltaBadgeContainer) {
              deltaBadgeContainer.innerHTML = `<div class="score-delta-badge">${Icons.check_circle} Clarity Boost: ${deltaStr}</div>`;
            }

            // Update metrics grid bars
            const sMetric = Math.min(99, Math.round(simScore * 0.98));
            const sepMetric = Math.min(99, Math.round(simScore * 0.95));
            const cMetric = Math.min(99, Math.round(simScore * 1.02));
            const snrMetric = Math.min(99, Math.round(simScore * 0.94));

                </div>

                <div class="science-cards-grid">
                  <!-- Reagent 1: Ninhydrin -->
                  <div class="science-ref-card">
                    <div class="science-card-accent-bar bar-purple"></div>
                    <div>
                      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                        <h3 style="font-size: 16px; font-weight: 800; color: #a855f7;">Ninhydrin</h3>
                        <span class="chem-formula">C&#8329;H&#8326;O&#8324;</span>
                      </div>
                      <p style="font-size: 12.5px; line-height: 1.5; color: var(--md-sys-color-on-surface-variant); margin-bottom: 14px;">
                        Reacts selectively with free &alpha;-amino acids (serine, glycine, alanine) in sweat via oxidative deamination & decarboxylation to produce a characteristic deep violet chromophore known as <strong>Ruhemann's Purple</strong>.
                      </p>
                    </div>

                    <div style="background: var(--md-sys-color-surface-container); border-radius: var(--md-shape-md); padding: 10px 12px;">
                      <div class="chem-spec-row">
                        <span class="chem-spec-label">Target Substrate:</span>
                        <span class="chem-spec-val" style="color: #a855f7;">Porous (Paper, Cardboard)</span>
                      </div>
                      <div class="chem-spec-row">
                        <span class="chem-spec-label">Chromophore:</span>
                        <span class="chem-spec-val">Ruhemann's Purple (570 nm)</span>
                      </div>
                      <div class="chem-spec-row">
                        <span class="chem-spec-label">Optimal Conditions:</span>
                        <span class="chem-spec-val">65&ndash;80% RH &bull; 70&ndash;80&deg;C</span>
                      </div>
                      <div class="chem-spec-row">
                        <span class="chem-spec-label">Durability:</span>
                        <span class="chem-spec-val">Stable for decades</span>
                      </div>
                    </div>
                  </div>

                  <!-- Reagent 2: Cyanoacrylate Ester -->
                  <div class="science-ref-card">
                    <div class="science-card-accent-bar bar-blue"></div>
                    <div>
                      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                        <h3 style="font-size: 16px; font-weight: 800; color: #38bdf8;">Cyanoacrylate (Superglue)</h3>
                        <span class="chem-formula">C&#8326;H&#8327;NO&#8322;</span>
                      </div>
                      <p style="font-size: 12.5px; line-height: 1.5; color: var(--md-sys-color-on-surface-variant); margin-bottom: 14px;">
                        Ethyl/methyl cyanoacrylate monomer heated to ~120&deg;C vaporizes in a fuming chamber. Monomers undergo <strong>base-catalyzed anionic polymerization</strong> initiated by trace moisture and amines to form durable 3D white <strong>polycyanoacrylate</strong> ridges.
                      </p>
                    </div>

                    <div style="background: var(--md-sys-color-surface-container); border-radius: var(--md-shape-md); padding: 10px 12px;">
                      <div class="chem-spec-row">
                        <span class="chem-spec-label">Target Substrate:</span>
                        <span class="chem-spec-val" style="color: #38bdf8;">Non-Porous (Glass, Metals, Plastic)</span>
                      </div>
                      <div class="chem-spec-row">
                        <span class="chem-spec-label">Polymer Product:</span>
                        <span class="chem-spec-val">White Polycyanoacrylate 3D Ridges</span>
                      </div>
                      <div class="chem-spec-row">
                        <span class="chem-spec-label">Fuming Chamber:</span>
                        <span class="chem-spec-val">75&ndash;80% RH &bull; 120&deg;C hotplate</span>
                      </div>
                      <div class="chem-spec-row">
                        <span class="chem-spec-label">Post-Staining:</span>
                        <span class="chem-spec-val">Rhodamine 6G / Ardrox (ALS 365nm)</span>
                      </div>
                    </div>
                  </div>

                  <!-- Reagent 3: Silver Nitrate -->
                  <div class="science-ref-card">
                    <div class="science-card-accent-bar bar-silver"></div>
                    <div>
                      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                        <h3 style="font-size: 16px; font-weight: 800; color: #94a3b8;">Silver Nitrate (Argentometric)</h3>
                        <span class="chem-formula">AgNO&#8323;</span>
                      </div>
                      <p style="font-size: 12.5px; line-height: 1.5; color: var(--md-sys-color-on-surface-variant); margin-bottom: 14px;">
                        Silver cations (Ag&#8314;) react with sodium chloride (NaCl) in perspiration to form silver chloride (AgCl&darr;). Upon ambient light or UV exposure, photolytic reduction yields insoluble dark colloidal metallic silver (Ag&#8304;).
                      </p>
                    </div>

                    <div style="background: var(--md-sys-color-surface-container); border-radius: var(--md-shape-md); padding: 10px 12px;">
                      <div class="chem-spec-row">
                        <span class="chem-spec-label">Target Substrate:</span>
                        <span class="chem-spec-val" style="color: #cbd5e1;">Porous / Wood (Raw Timber, Card)</span>
                      </div>
                      <div class="chem-spec-row">
                        <span class="chem-spec-label">Deposit Product:</span>
                        <span class="chem-spec-val">Colloidal Metallic Silver (Ag&#8304;)</span>
                      </div>
                      <div class="chem-spec-row">
                        <span class="chem-spec-label">Excitation:</span>
                        <span class="chem-spec-val">Photolytic UV / Ambient light reduction</span>
                      </div>
                      <div class="chem-spec-row">
                        <span class="chem-spec-label">Application:</span>
                        <span class="chem-spec-val">Highly effective on aged evidence</span>
                      </div>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          </div>
        `;

        // Interactive jump handlers
        info.querySelectorAll('.info-jump-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const target = btn.dataset.target;
            if (target) appState.navigateTo(target);
          });
        });

        // Toggle UV mode handler from step 3
        info.querySelectorAll('.info-action-uv').forEach(btn => {
          btn.addEventListener('click', () => {
            appState.toggleUVMode();
            renderInfo();
          });
        });
      }

      function renderBottomNav() {
        const nav = document.getElementById('bottom-nav-container');
        nav.innerHTML = `
          <nav class="m3-bottom-nav">
            <button class="nav-item active" data-tab="home"><div class="nav-pill-indicator">${Icons.home}</div><span class="nav-label">Home</span></button>
            <button class="nav-item" data-tab="upload"><div class="nav-pill-indicator">${Icons.upload}</div><span class="nav-label">Upload</span></button>
            <button class="nav-item" data-tab="enhance"><div class="nav-pill-indicator">${Icons.auto_fix_high}</div><span class="nav-label">Enhance</span></button>
            <button class="nav-item" data-tab="match"><div class="nav-pill-indicator">${Icons.compare}</div><span class="nav-label">Match</span></button>
            <button class="nav-item" data-tab="reagents"><div class="nav-pill-indicator">${Icons.science}</div><span class="nav-label">Reagents</span></button>
            <button class="nav-item" data-tab="scope"><div class="nav-pill-indicator">${Icons.psychology}</div><span class="nav-label">Scope</span></button>
            <button class="nav-item" data-tab="info"><div class="nav-pill-indicator">${Icons.info}</div><span class="nav-label">Guide</span></button>
          </nav>
        `;
        nav.addEventListener('click', (e) => {
          const btn = e.target.closest('.nav-item');
          if (btn) appState.navigateTo(btn.dataset.tab);
        });
      }

      // Expose to window for testing, QA, and DevTools console inspection
      window.appState = appState;
      window.Icons = Icons;
      window.SampleGenerator = SampleGenerator;
      window.Pipeline = Pipeline;
      window.FingerprintCropper = FingerprintCropper;
      window.ChemicalDetector = ChemicalDetector;
      window.ChemicalSimulator = ChemicalSimulator;
      window.AFISMatcher = AFISMatcher;
      window.HenryClassifier = HenryClassifier;
      window.UVVisSpectrometer = UVVisSpectrometer;
      window.ForensicReportGenerator = ForensicReportGenerator;
      window.renderHome = renderHome;
      window.renderUpload = renderUpload;
      window.renderEnhance = renderEnhance;
      window.renderMatch = renderMatch;
      window.renderReagents = renderReagents;
      window.renderScope = renderScope;
      window.renderInfo = renderInfo;

      // Initial Clean Mount (Home screen appears immediately with ZERO background execution)
      const initApp = () => {
        renderHome();
        renderBottomNav();

        appState.on('navigatedTo', (tab) => {
          if (tab === 'home') renderHome();
          if (tab === 'upload') renderUpload();
          if (tab === 'enhance') renderEnhance();
          if (tab === 'match') renderMatch();
          if (tab === 'reagents') renderReagents();
          if (tab === 'scope') renderScope();
          if (tab === 'info') renderInfo();
        });

        // Mockup controls
        document.getElementById('toggle-frame-btn')?.addEventListener('click', () => {
          document.querySelector('.phone-mockup')?.classList.toggle('fullscreen');
        });
        document.getElementById('toggle-theme-desktop-btn')?.addEventListener('click', () => {
        document.getElementById('btn-export-report-desktop')?.addEventListener('click', () => {
          const orig = appState.get('originalCanvas');
          const enh = appState.get('enhancedCanvas') || orig;
          const ridge = appState.get('ridgeMapCanvas') || enh;
          const clar = appState.get('clarityScore');
          const mResult = appState.get('matchResult');
          const reagent = appState.get('appliedChemical') ? appState.get('appliedChemical').toUpperCase() : 'Ninhydrin';
          const substrate = appState.get('substrate') ? appState.get('substrate').toUpperCase() : 'Paper / Cardboard (Porous)';
          const isUV = appState.get('uvMode');
          const henry = appState.state.henryResult || (orig ? HenryClassifier.classify(orig) : { pattern: 'Loop', subtype: 'Ulnar Loop', frequency: '65%', cores: 1, deltas: 1 });
          ForensicReportGenerator.openReport({ originalCanvas: orig, enhancedCanvas: enh, ridgeMapCanvas: ridge, clarityScore: clar, reagent: reagent, substrate: substrate, isUV: isUV, henry: henry, matchResult: mResult });
        });
          const next = appState.get('theme') === 'dark' ? 'light' : 'dark';
          appState.set('theme', next);
          document.documentElement.setAttribute('data-theme', next);
        });
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
</html>
